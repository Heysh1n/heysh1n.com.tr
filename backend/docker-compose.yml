services:
  payload:
    image: node:22-alpine
    ports:
      - '3000:3000'
    volumes:
      - ..:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app
    command: sh -c "npm install && npm run dev:backend"
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      DATABASE_URI: postgresql://postgres:postgres@postgres:5432/payload_cms

  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: payload_cms
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  node_modules:
  pgdata:
